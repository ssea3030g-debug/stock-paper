# 파크골프 수첩 서버 설정 — 자세한 설치 방법은 README.md
name = "parkgolf-server"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 앱 주소만 이 서버를 쓰게 막기 (쉼표로 여러 개). 예: "https://아이디.github.io"
# 비워 두면 아무 주소에서나 부를 수 있어요 — 그때는 APP_PASSCODE 를 꼭 넣으세요.
ALLOWED_ORIGINS = ""
# 하루 AI 분석 최대 횟수 (대략적인 값)
AI_DAILY_LIMIT = "30"

# 같은 사람이 AI 버튼을 연달아 누르는 것 막기: 1분에 5번까지
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# 비밀값은 여기 쓰지 말고 명령으로 넣으세요:
#   npx wrangler secret put KMA_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put APP_PASSCODE
